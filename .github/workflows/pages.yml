# main에 push되면 깨끗한 checkout에서 빌드해 GitHub Pages에 배포한다.
# 앱 버전은 빌드한 커밋(8자리)이며, 작업 트리가 깨끗하지 않으면(-dirty) 배포를 멈춘다.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 공개 전 검사가 이력 전체를 본다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 배포는 ci 워크플로와 따로 돌기 때문에 같은 검사를 여기서도 한다
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:rules
      - run: npm run scan:private
      - run: npm run build:web
      - name: 앱 버전 확인(-dirty 금지)
        run: |
          expected="$(git rev-parse --short=8 HEAD)"
          if grep -q -- "${expected}-dirty" dist/assets/worker-*.js; then echo "작업 트리가 깨끗하지 않습니다"; exit 1; fi
          grep -q -- "\"${expected}\"" dist/assets/worker-*.js || { echo "번들에 앱 버전 ${expected}가 없습니다"; exit 1; }
          echo "앱 버전: ${expected}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
